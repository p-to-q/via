name: Feature proposal
description: Propose a focused improvement to the graph, Skill, or CLI.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What map-reading problem does this solve?
      description: Describe the user-visible problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example task and expected map change
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps via focused on turning tasks into Git-tree maps.
          required: true
