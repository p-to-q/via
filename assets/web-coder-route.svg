<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="Ship the first useful route map">
  <style>
    text{font-family:"Google Sans Text","Google Sans",Roboto,"Noto Sans SC",Arial,sans-serif}.title{font-size:20px;font-weight:600;fill:#202124}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.4px;fill:#5F6368}.node-label{font-size:11px;font-weight:500;fill:#202124}.card-label{font-size:14px;font-weight:600;fill:#202124}.cost{font-size:25px;font-weight:650;fill:#202124}.unit{font-size:12px;font-weight:500;fill:#5F6368}.meta{font-size:12px;font-weight:400;fill:#5F6368}.gate-count{font-size:11px;font-weight:600;fill:#5F6368}.summary{font-size:11px;font-weight:500;fill:#202124}.selected .summary{fill:#1A73E8}.card rect{transition:fill .18s ease,stroke .18s ease}.flow{opacity:.22;stroke-dasharray:2 15;animation:travel 1.25s linear infinite}.window-lights circle{transform-box:fill-box;transform-origin:center}.window-lights:hover circle{animation:light-pop .32s ease both}.window-lights circle:nth-child(2){animation-delay:.04s}.window-lights circle:nth-child(3){animation-delay:.08s}@keyframes travel{to{stroke-dashoffset:-34}}@keyframes light-pop{50%{transform:scale(1.2)}}@media(prefers-reduced-motion:reduce){.flow{animation:none}.window-lights circle{animation:none!important}.card rect{transition:none}}
  </style>
