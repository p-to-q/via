ound"/><path class="flow" d="M468 278 C522 278 678 278 732 278" fill="none" stroke="#92709D" stroke-width="2" stroke-linecap="round"/><path class="edge e7" d="M468 278 C522 278 546 346 600 346" fill="none" stroke="#92709D" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/><path class="flow" d="M468 278 C522 278 546 346 600 346" fill="none" stroke="#92709D" stroke-width="2" stroke-linecap="round"/><path class="edge e8" d="M600 346 C654 346 678 278 732 278" fill="none" stroke="#92709D" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/><path class="flow" d="M600 346 C654 346 678 278 732 278" fill="none" stroke="#92709D" stroke-width="2" stroke-linecap="round"/><path class="edge e9" d="M732 278 C786 278 810 278 864 278" fill="none" stroke="#92709D" stroke-width="6" stroke-linecap="round"/><path class="flow" d="M732 278 C786 278 810 278 864 278" fill="none" stroke="#92709D" stroke-width="2" stroke-linecap="round"/><path class="edge e10" d="M336 278 C390 278 414 414 468 414" fill="none" stroke="#F0AE00" stroke-width="6" stroke-linecap="round"/><path class="flow" d="M336 278 C390 278 414 414 468 414" fill="none" stroke="#F0AE00" stroke-width="2" stroke-linecap="round"/><path class="edge e11" d="M468 414 C522 414 678 414 732 414" fill="none" stroke="#F0AE00" stroke-width="6" stroke-linecap="round"/><path class="flow" d="M468 414 C522 414 678 414 732 414" fill="none" stroke="#F0AE00" stroke-width="2" stroke-linecap="round"/><path class="edge e12" d="M732 414 C786 414 810 278 864 278" fill="none" stroke="#F0AE00" stroke-width="6" stroke-linecap="round"/><path class="flow" d="M732 414 C786 414 810 278 864 278" fill="none" stroke="#F0AE00" stroke-width="2" stroke-linecap="round"/><path class="edge e13" d="M864 278 C918 278 942 278 996 278" fill="none" stroke="#16181D" stroke-width="7" stroke-linecap="round"/><path class="flow" d="M864 278 C918 278 942 278 996 278" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round"/><g class="node"><circle cx="72" cy="278" r="11" fill="#FBFBFC" stroke="#16181D" stroke-width="4"/></g><g class="node"><circle cx="204" cy="278" r="11" fill="#FBFBFC" stroke="#16181D" stroke-width="4"/><text x="204" y="307" text-anchor="middle" class="node-label">inspect task</text></g><g class="node"><circle cx="336" cy="278" r="11" fill="#FBFBFC" stroke="#16181D" stroke-width="4"/><g transform="translate(349 261)"><circle r="6" fill="#40C878" stroke="#FBFBFC" stroke-width="3"/></g><text x="336" y="307" text-anchor="middle" class="node-label">frame routes</text></g><g class="node"><circle cx="468" cy="142" r="11" fill="#FBFBFC" stroke="#72B600" stroke-width="4"/><text x="468" y="171" text-anchor="middle" class="node-label">lock contract</text></g><g class="node"><circle cx="732" cy="142" r="11" fill="#FBFBFC" stroke="#72B600" stroke-width="4"/><text x="732" y="171" text-anchor="middle" class="node-label">render map</text></g><g class="node"><circle cx="468" cy="278" r="11" fill="#FBFBFC" stroke="#92709D" stroke-width="4"/><text x="468" y="307" text-anchor="middle" class="node-label">wire graph</text></g><g class="node"><circle cx="600" cy="346" r="11" fill="#FBFBFC" stroke="#92709D" stroke-width="4"/><text x="600" y="375" text-anchor="middle" class="node-label">motion pass</text></g><g class="node"><circle cx="732" cy="278" r="11" fill="#FBFBFC" stroke="#92709D" stroke-width="4"/><g transform="translate(745 261)"><circle r="6" fill="#FFBD2E" stroke="#FBFBFC" stroke-width="3"/></g><text x="732" y="307" text-anchor="middle" class="node-label">5 user check</text></g><g class="node"><circle cx="468" cy="414" r="11" fill="#FBFBFC" stroke="#F0AE00" stroke-width="4"/><text x="468" y="443" text-anchor="middle" class="node-label">runtime hooks</text></g><g class="node"><circle cx="732" cy="414" r="11" fill="#FBFBFC" stroke="#F0AE00" stroke-width="4"/><g transform="translate(745 397)"><circle r="6" fill="#FF5F57" stroke="#FBFBFC" stroke-width="3"/></g><text x="732" y="443" text-anchor="middle" class="node-label">measure run</text></g><g class="node"><circle cx="864" cy="278" r="11" fill="#FBFBFC" stroke="#16181D" stroke-width="4"/><text x="864" y="307" text-anchor="middle" class="node-label">validate</text></g><g class="node"><circle cx="996" cy="278" r="11" fill="#FBFBFC" stroke="#16181D" stroke-width="4"/></g></g>
  <text x="72" y="447" text-anchor="middle" class="eyebrow">START</text>
  <text x="996" y="447" text-anchor="middle" class="eyebrow">DONE</text>
  <g class="card" transform="translate(36 494)">
      <rect width="322" height="126" rx="18" fill="#FFFFFF" stroke="#72B600" stroke-width="3"/>
      <circle cx="22" cy="25" r="5" fill="#72B600"/>
      <text x="35" y="30" class="card-label">Skill first</text>
      <text x="292" y="29" text-anchor="end" class="recommended">REC</text>
      <text x="20" y="69" class="cost">3.5k–9k<tspan class="unit"> tok</tspan></text>
      <text x="20" y="94" class="meta">20–45 min · 1 gate</text>
