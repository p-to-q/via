    <circle cx="20" cy="0" r="6" fill="#FFBD2E"/>
    <circle cx="40" cy="0" r="6" fill="#40C878"/>
  </g>
  <text x="100" y="39" class="eyebrow">VIA / ROUTE</text>
  <text x="36" y="82" class="title">Ship the first useful route map</text>
