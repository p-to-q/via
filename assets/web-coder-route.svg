<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="Ship the first useful route map">
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:20px;font-weight:680;fill:#16181D}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.6px;fill:#858990}.node-label{font-size:11px;font-weight:560;fill:#16181D}.card-label{font-size:14px;font-weight:650;fill:#16181D}.cost{font-size:25px;font-weight:730;fill:#16181D}.unit{font-size:12px;font-weight:600;fill:#858990}.meta{font-size:12px;fill:#858990}.summary{font-size:11px;fill:#16181D}.recommended{font-size:10px;font-weight:750;letter-spacing:1px;fill:#72B600}.flow{opacity:.34;stroke-dasharray:2 15;animation:travel 1.25s linear infinite}.window-lights circle{transform-box:fill-box;transform-origin:center}.window-lights:hover circle{animation:light-pop .32s ease both}.window-lights circle:nth-child(2){animation-delay:.04s}.window-lights circle:nth-child(3){animation-delay:.08s}@keyframes travel{to{stroke-dashoffset:-34}}@keyframes light-pop{50%{transform:scale(1.2)}}@media(prefers-reduced-motion:reduce){.flow{animation:none}.window-lights circle{animation:none!important}}
  </style>
  <rect width="1080" height="660" rx="24" fill="#F1F2F4"/>
  <rect x="18" y="14" width="1044" height="628" rx="20" fill="#FBFBFC" stroke="#E0E2E6"/>
