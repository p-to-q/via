<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="route-title route-desc">
  <title id="route-title">Three routes for Prepare Via for a first public release</title>
  <desc id="route-desc">Skill first: 3.5k to 9k tokens, 5 to 12 minutes, 4 checkpoints, suggested. Interface first: 6k to 14k tokens, 10 to 25 minutes, 5 checkpoints. Telemetry first: 9k to 22k tokens, 20 to 45 minutes, 5 checkpoints</desc>
