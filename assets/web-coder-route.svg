<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="Ship the first useful route map">
  <defs>
    <filter id="dock-shadow" x="-8%" y="-30%" width="116%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#000000" flood-opacity=".075"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity=".045"/>
    </filter>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Arial,sans-serif;font-variant-numeric:tabular-nums}.title{font-size:22px;font-weight:600;fill:#1F1F1F}.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.1px;fill:#6B6B6B}.node-label{font-size:12px;font-weight:450;fill:#1F1F1F}.card-label{font-size:14px;font-weight:600;fill:#1F1F1F}.cost{font-size:24px;font-weight:600;fill:#1F1F1F}.unit{font-size:12px;font-weight:500;fill:#6B6B6B}.meta{font-size:12px;font-weight:500;fill:#6B6B6B}.gate-count{font-size:12px;font-weight:500;fill:#6B6B6B}.summary{font-size:12px;font-weight:400;fill:#6B6B6B}.card rect,.route-rail{transition:fill .18s ease,stroke .18s ease}.flow{opacity:.16;stroke-dasharray:2 15;animation:travel 1.25s linear infinite}.window-lights circle{transform-box:fill-box;transform-origin:center}.window-lights:hover circle{animation:light-pop .32s ease both}.window-lights circle:nth-child(2){animation-delay:.04s}.window-lights circle:nth-child(3){animation-delay:.08s}@keyframes travel{to{stroke-dashoffset:-34}}@keyframes light-pop{50%{transform:scale(1.2)}}@media(prefers-reduced-motion:reduce){.flow{animation:none}.window-lights circle{animation:none!important}.card rect,.route-rail{transition:none}}
  </style>
